<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <style>
        h1{
            background-color: rgb(157, 157, 244);
            
        }
        h2{
            background-color: rgb(249, 164, 60);
        }
    </style>
</head>
<body>
    <H1>UNORDERED LIST</H1>
    <h2>Default is disc</h2>
    <ul>
       <li>HTML5</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>PYTHON</li>
        <li>JAVA</li>
        <li>SQL</li>
        <li>EXCEL</li>
    </ul>
    <h2>square</h2>
    <ul type="square">
       <li>HTML5</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>PYTHON</li>
        <li>JAVA</li>
        <li>SQL</li>
        <li>EXCEL</li>
    </ul>
    <h2>circle</h2>
      <ul type="circle">
       <li>HTML5</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>PYTHON</li>
        <li>JAVA</li>
        <li>SQL</li>
        <li>EXCEL</li>
    </ul>
    
</body>
</html>

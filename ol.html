<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <style>
        h1{
            background-color: rgb(157, 157, 244);
            
        }
        h2{
            background-color: rgb(249, 164, 60);
        }
    </style>
</head>
<body>
    <H1>ORDERED LIST</H1>
    <h2>Default is number</h2>
    <OL>
        <li>HTML5</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>PYTHON</li>
        <li>JAVA</li>
        <li>SQL</li>
        <li>EXCEL</li>
    </OL>
    <h2>Alpha</h2>
    <ol type="A">
        <li>HTML5</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>PYTHON</li>
        <li>JAVA</li>
        <li>SQL</li>
        <li>EXCEL</li>
    </ol>
    <h2>Numeric</h2>
    <ol type="i">
        <li>HTML5</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>PYTHON</li>
        <li>JAVA</li>
        <li>SQL</li>
        <li>EXCEL</li>
    </ol>
</body>
</html>
